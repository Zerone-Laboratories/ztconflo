[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztconflo"
version = "0.1.0"
description = "A phone codename in, a flashable ztOS image out"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"

[project.scripts]
ztconflo = "ztconflo.cli:main"

[tool.setuptools]
packages = ["ztconflo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
